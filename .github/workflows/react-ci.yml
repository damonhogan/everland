name: React CI

on: [push, pull_request]

jobs:
  test-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install and test
        working-directory: react
        run: |
          npm ci
          npm test --silent
